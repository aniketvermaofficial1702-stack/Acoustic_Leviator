<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acoustic Levitator – Lab Unit (3D)</title>
<style>
:root{--bg:#F3F5FF;--ink:#0B1230;--mut:#4A5578;--card:#FFFFFF;--line:#D6DCF2;--c1:#0891B2;--c2:#7C3AED;--c3:#D97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070B20;--ink:#EEF2FF;--mut:#A3AFD6;--card:#111A3C;--line:#26336A;--c1:#22D3EE;--c2:#A78BFA;--c3:#FBBF24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070B20;--ink:#EEF2FF;--mut:#A3AFD6;--card:#111A3C;--line:#26336A;--c1:#22D3EE;--c2:#A78BFA;--c3:#FBBF24;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
#app{position:relative;width:100%;height:100%;background:radial-gradient(900px 500px at 85% 0%,color-mix(in srgb,var(--c2) 14%,transparent),transparent),var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#pn{position:absolute;left:12px;top:12px;width:262px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;z-index:3;box-shadow:0 4px 18px rgba(0,0,0,.12)}
#pn h1{font-size:17px;margin:0 0 4px}
#pn p{margin:0 0 8px;color:var(--mut);font-size:13px;line-height:1.4}
#pn label{display:block;margin:10px 0 2px;font-weight:600}
#pn input[type=range]{width:100%;accent-color:var(--c1)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:500}
#pn button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:14px;cursor:pointer;margin:8px 6px 0 0}
#pw{background:var(--c1)!important;color:var(--bg)!important;font-weight:700;border-color:var(--c1)!important}
#pw.off{background:var(--card)!important;color:var(--ink)!important}
#ro{color:var(--c1);font-weight:700;font-size:13px;margin:6px 0 0}
.lb{position:absolute;z-index:2;pointer-events:none;font-size:12px;font-weight:600;background:var(--card);color:var(--ink);border:1px solid var(--c1);border-radius:99px;padding:3px 10px;white-space:nowrap;transform:translate(-50%,-50%)}
#err{display:none;position:absolute;inset:0;place-items:center;text-align:center;padding:24px;font-size:18px;color:var(--mut)}
</style></head><body><div id="app">
<canvas id="cv"></canvas>
<div id="pn">
<h1>Acoustic levitator · lab unit</h1>
<p><b>Drag</b> to rotate · <b>scroll</b> to zoom · <b>drag a sample</b> to move it. Press the green button on the unit, or the Power button here.</p>
<button id="pw">Power: ON</button><button id="rs">Reset</button>
<label for="fq">Frequency: <span id="fv">40</span> kHz</label>
<input id="fq" type="range" min="30" max="50" step="0.5" value="40">
<label for="ph">Phase shift (steering): <span id="pv">0</span>°</label>
<input id="ph" type="range" min="-45" max="45" step="1" value="0">
<div class="row"><input id="cl" type="checkbox" checked><label for="cl" style="margin:0">Part labels</label></div>
<div class="row"><input id="cp" type="checkbox" checked><label for="cp" style="margin:0">Standing wave and pulses</label></div>
<div class="row"><input id="ca" type="checkbox"><label for="ca" style="margin:0">Auto-rotate</label></div>
<div id="ro"></div>
</div>
<div id="lbs"></div>
<div id="err">3D could not start on this device. Try a recent Chrome, Edge or Firefox.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
try{
var $=function(i){return document.getElementById(i)},cs=getComputedStyle(document.documentElement),
C=function(n){return new THREE.Color(cs.getPropertyValue(n).trim())},c1=C("--c1"),c2=C("--c2"),c3=C("--c3");
var cv=$("cv"),r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio||1,2));
var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,100);sc.add(cam);
sc.add(new THREE.AmbientLight(0xffffff,.75));var lt=new THREE.PointLight(0xffffff,1,0);lt.position.set(3,6,8);cam.add(lt);
var th=.5,pv=1.3,R=12,TY=-.3,Rs=1.45,GAP=34.3,SC=2.9/GAP,pw=true,fk=40,half=171.5/fk,sh=0,nv=8;
function M(c,o){o=o||{};o.color=c;return new THREE.MeshStandardMaterial(o)}
function box(w,h,d,c,x,y,z,o){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o||{roughness:.6}));m.position.set(x,y,z);sc.add(m);return m}
function size(){var w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
function setCam(){cam.position.set(R*Math.sin(pv)*Math.sin(th),TY+R*Math.cos(pv),R*Math.sin(pv)*Math.cos(th));cam.lookAt(0,TY,0)}
/* bench + base */
var gr=new THREE.GridHelper(16,32,c1,c1);gr.position.y=-2.14;gr.material.transparent=true;gr.material.opacity=.15;sc.add(gr);
box(6,.25,3.8,0x2b3040,0,-2.125,0,{roughness:.5,metalness:.3});
var ped=new THREE.Mesh(new THREE.CylinderGeometry(.75,.9,.4,40),M(0x3a4156,{roughness:.4,metalness:.4}));ped.position.y=-1.8;sc.add(ped);
/* two opposed transducer arrays on spherical caps */
var tm=M(0xc3c8d4,{roughness:.3,metalness:.85,emissive:c1,emissiveIntensity:0}),Y=new THREE.Vector3(0,1,0),rings=[[1,0],[6,.27],[12,.52],[17,.77]];
[1,-1].forEach(function(s){
var shell=new THREE.Mesh(new THREE.SphereGeometry(Rs+.13,40,16,0,Math.PI*2,0,.95),M(0x222733,{roughness:.55,metalness:.25,side:THREE.DoubleSide}));if(s<0)shell.rotation.x=Math.PI;sc.add(shell);
rings.forEach(function(rg){for(var i=0;i<rg[0];i++){var a=i/rg[0]*Math.PI*2+rg[1],p=new THREE.Vector3(Rs*Math.sin(rg[1])*Math.cos(a),s*Rs*Math.cos(rg[1]),Rs*Math.sin(rg[1])*Math.sin(a));
var t=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.16,18),tm);t.position.copy(p);t.quaternion.setFromUnitVectors(Y,p.clone().negate().normalize());sc.add(t)}})});
[30,150,270].forEach(function(d){var a=d*Math.PI/180,p=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,3.5,16),M(0x4a5168,{roughness:.4,metalness:.5}));p.position.set(1.32*Math.cos(a),-.05,1.32*Math.sin(a));sc.add(p)});
/* electronics */
box(.95,.5,.65,0x14161c,-2.4,-1.75,-.2);box(.95,.06,.65,0x0f7a45,2.3,-1.97,.25);box(.5,.05,.35,0x2a6fd0,2.3,-1.97,-.8);box(.14,.1,.16,0xc9ced8,2.1,-1.92,-.8,{metalness:.8,roughness:.3});
box(.3,.12,.3,0x15171c,2.4,-1.9,.25);box(2.2,.8,.8,0x30364a,0,-1.62,1.7,{roughness:.5,metalness:.3});
function cab(pts,c){sc.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(function(p){return new THREE.Vector3(p[0],p[1],p[2])})),30,.03,6),M(c,{roughness:.7})))}
cab([[-2.4,-1.5,-.2],[-2.4,-1.95,.6],[1.6,-1.95,.7],[2.3,-1.93,.25]],0xc0392b);cab([[2.3,-1.93,.0],[2.3,-1.93,-.4],[2.3,-1.93,-.7]],0xf1c40f);
cab([[2.0,-1.93,.25],[1.2,-1.9,.0],[.5,-1.62,.1],[.15,-1.5,.2]],0xe8e8e8);cab([[2.3,-1.93,.45],[1.7,-1.8,-.9],[1.1,-.4,-1.1],[.7,1.2,-.9],[.4,1.5,-.4]],0xe8e8e8);
/* LCD, knob, power button */
var lc=document.createElement("canvas");lc.width=256;lc.height=96;var lx=lc.getContext("2d"),lcd=new THREE.CanvasTexture(lc);
var scr=new THREE.Mesh(new THREE.PlaneGeometry(1.15,.43),new THREE.MeshBasicMaterial({map:lcd}));scr.position.set(-.2,-1.55,2.11);sc.add(scr);
var kn=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.1,24),M(0xd0d4de,{metalness:.7,roughness:.3}));kn.rotation.x=Math.PI/2;kn.position.set(.65,-1.55,2.14);sc.add(kn);
var btn=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.1,24),new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x22c55e,emissiveIntensity:.8}));btn.rotation.x=Math.PI/2;btn.position.set(.92,-1.55,2.14);sc.add(btn);
function lcdDraw(){lx.fillStyle="#08240f";lx.fillRect(0,0,256,96);lx.fillStyle=pw?"#7CFC7C":"#2c5a35";lx.font="bold 15px monospace";
lx.fillText("ACOUSTIC LEVITATOR",14,24);lx.font="bold 26px monospace";lx.fillText(fk.toFixed(1)+" kHz",14,56);lx.font="bold 15px monospace";
lx.fillText("PHASE "+($("ph").value>=0?"+":"")+$("ph").value+"  "+(pw?"ON":"OFF"),14,84);lcd.needsUpdate=true}
/* standing wave visuals */
var pls=[],lns=[],N=121,pr=[],bs=[];
for(var i=0;i<12;i++){var p=new THREE.Mesh(new THREE.CircleGeometry(.5,40),new THREE.MeshBasicMaterial({color:c1,transparent:true,opacity:.12,side:THREE.DoubleSide}));p.rotation.x=Math.PI/2;sc.add(p);pls.push(p)}
for(var l=0;l<2;l++){var g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.BufferAttribute(new Float32Array(N*3),3));var ln=new THREE.Line(g,new THREE.LineBasicMaterial({color:c1}));ln.rotation.y=l*Math.PI/2;sc.add(ln);lns.push(ln)}
for(var i=0;i<6;i++){var m=new THREE.Mesh(new THREE.TorusGeometry(.5,.01,8,48),new THREE.MeshBasicMaterial({color:c1,transparent:true}));m.rotation.x=Math.PI/2;sc.add(m);pr.push(m)}
/* samples: 2 beads, 2 droplets */
var RX=[-.35,-.12,.12,.35],REST=-1.4;
for(var i=0;i<4;i++){var dr=i%2,b=new THREE.Mesh(new THREE.SphereGeometry(dr?.1:.085,24,24),dr?new THREE.MeshStandardMaterial({color:0x4aa8ff,transparent:true,opacity:.75,roughness:.05,metalness:.1}):M(0xf4f4ef,{roughness:.5}));
b.add(new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshBasicMaterial({visible:false})));b.userData={j:i,k:0,ox:0,oz:0,vy:0};b.position.set(RX[i],REST,0);sc.add(b);bs.push(b)}
function ny(k){return -Rs+((k+.5)*half+sh)*SC}
function nodeCount(){var n=0;while(n<12&&(n+.5)*half+sh<GAP)n++;return n}
function nearest(y){var d=(y+Rs)/SC-sh;return Math.max(0,Math.min(nv-1,Math.round(d/half-.5)))}
function ui(){fk=+$("fq").value;half=171.5/fk;sh=+$("ph").value/180*half;nv=nodeCount();$("fv").textContent=fk;$("pv").textContent=$("ph").value;
$("ro").textContent="λ = "+(343/fk).toFixed(2)+" mm · nodes every "+half.toFixed(2)+" mm";lcdDraw()}
function power(v){pw=v;btn.material.color.set(pw?0x22c55e:0x7a1f1f);btn.material.emissive.set(pw?0x22c55e:0x000000);$("pw").textContent="Power: "+(pw?"ON":"OFF");$("pw").className=pw?"":"off";lcdDraw()}
function reset(){th=.5;pv=1.3;R=innerWidth<700?18:12;bs.forEach(function(b){var u=b.userData;u.k=Math.max(0,Math.min(nv-1,Math.floor(nv/2)-2+u.j));u.ox=0;u.oz=0});power(true);setCam()}
["fq","ph"].forEach(function(i){$(i).addEventListener("input",ui)});$("rs").onclick=reset;$("pw").onclick=function(){power(!pw)};
/* labels */
var LB=[["Transducer array (40 kHz)",.9,1.55,.5],["Levitated samples",.55,0,0],["3D-printed frame",1.35,.6,.8],["Arduino controller",2.3,-1.7,-.8],["Driver board",2.3,-1.7,.4],["Power supply",-2.4,-1.35,-.2],["Control panel",-.2,-1.1,1.9],["Lower array",-.9,-1.5,.5]].map(function(a){var e=document.createElement("div");e.className="lb";e.textContent=a[0];$("lbs").appendChild(e);return{e:e,p:new THREE.Vector3(a[1],a[2],a[3])}});
/* pointer */
var ray=new THREE.Raycaster(),mv=new THREE.Vector2(),drag=null,orb=false,lx0=0,ly0=0,pn=new THREE.Plane(),dv=new THREE.Vector3(),hp=new THREE.Vector3();
function ndc(e){var b=cv.getBoundingClientRect();mv.set((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height*2-1));ray.setFromCamera(mv,cam)}
function pick(e){ndc(e);if(ray.intersectObject(btn)[0])return"btn";if(!pw)return null;var hs=[];bs.forEach(function(b){hs.push(b.children[0])});var h=ray.intersectObjects(hs,false)[0];return h?h.object.parent:null}
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);var b=pick(e);if(b==="btn"){power(!pw);return}cv.style.cursor="grabbing";if(b)drag=b;else{orb=true;lx0=e.clientX;ly0=e.clientY}});
cv.addEventListener("pointermove",function(e){
if(drag){ndc(e);cam.getWorldDirection(dv);pn.setFromNormalAndCoplanarPoint(dv,drag.position);if(ray.ray.intersectPlane(pn,hp)){var u=drag.userData;u.ox=Math.max(-.3,Math.min(.3,hp.x));u.oz=Math.max(-.3,Math.min(.3,hp.z));u.k=nearest(hp.y)}}
else if(orb){th-=(e.clientX-lx0)*.008;pv=Math.max(.15,Math.min(Math.PI-.15,pv-(e.clientY-ly0)*.008));lx0=e.clientX;ly0=e.clientY;setCam()}
else cv.style.cursor=pick(e)?"pointer":"grab"});
function up(){drag=null;orb=false;cv.style.cursor="grab"}cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",function(e){e.preventDefault();R=Math.max(5,Math.min(22,R*Math.exp(e.deltaY*.001)));setCam()},{passive:false});
/* loop */
var last=0;
function loop(ms){requestAnimationFrame(loop);var t=ms/1000,dt=Math.min(t-last,.05);last=t;
if($("ca").checked&&!orb){th+=dt*.25;setCam()}
var wv=pw&&$("cp").checked,ps=Math.cos(t*3),kk=Math.PI/half;
tm.emissiveIntensity=pw?.35+.25*Math.sin(t*8):0;
pls.forEach(function(p,k){p.visible=wv&&k<nv;p.position.y=ny(k)});
lns.forEach(function(ln){ln.visible=wv;var a=ln.geometry.attributes.position;for(var i=0;i<N;i++){var y=-Rs+i*2.9/(N-1),d=(y+Rs)/SC-sh;a.setXYZ(i,.22*Math.cos(kk*d)*ps,y,0)}a.needsUpdate=true});
pr.forEach(function(m,i){m.visible=wv;var f=(t*.4+i/3)%1,up2=i<3;m.position.y=up2?Rs-f*Rs:-Rs+f*Rs;m.scale.setScalar(1-f*.45);m.material.opacity=Math.sin(f*Math.PI)*.7});
bs.forEach(function(b){var u=b.userData;if(u.k>=nv)u.k=nv-1;var p=b.position;
if(pw){var ty=ny(u.k);u.vy+=(70*(ty-p.y)-11*u.vy)*dt;p.x+=(u.ox-p.x)*.15;p.z+=(u.oz-p.z)*.15}
else{u.vy-=7*dt;p.x+=(RX[u.j]-p.x)*.05;p.z+=(0-p.z)*.05}
p.y+=u.vy*dt;if(!pw&&p.y<REST){p.y=REST;u.vy=Math.abs(u.vy)>.4?-u.vy*.3:0}});
var w=cv.clientWidth,h=cv.clientHeight,on=$("cl").checked;
LB.forEach(function(l){var q=l.p.clone().project(cam);l.e.style.display=on&&q.z<1?"block":"none";l.e.style.left=((q.x+1)/2*w)+"px";l.e.style.top=((1-q.y)/2*h)+"px"});
r.render(sc,cam)}
addEventListener("resize",size);size();ui();reset();requestAnimationFrame(loop);
}catch(e){console.warn("3D unavailable",e);var er=document.getElementById("err");er.style.display="grid";document.getElementById("pn").style.display="none"}
</script></body></html>
